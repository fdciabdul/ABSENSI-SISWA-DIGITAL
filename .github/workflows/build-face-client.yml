name: Build Face Recognition Client

# Builds face_recognition/main.py into a single Windows .exe with PyInstaller.
# Run manually from the Actions tab, or push a version tag (v*) to also
# publish the .exe as a GitHub Release asset.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12' # mediapipe requires <= 3.12

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r face_recognition/requirements.txt
          pip install pyinstaller==6.15.0

      # --collect-all is required: customtkinter ships theme JSONs and
      # mediapipe ships model files that PyInstaller misses otherwise.
      # Console mode is kept ON: the app prints the generated admin password
      # to the console once on first run.
      - name: Build exe
        run: >
          pyinstaller --noconfirm --onefile --console
          --name absensi-face-client
          --collect-all customtkinter
          --collect-all mediapipe
          face_recognition/main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: absensi-face-client-windows
          path: dist/absensi-face-client.exe
          retention-days: 30

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/absensi-face-client.exe
          generate_release_notes: true
